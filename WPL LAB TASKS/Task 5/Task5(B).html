<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Steam Signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Verdana', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #c6d4df;
    }

    .signup-card {
      width: 390px;
      background-color: #1b2838;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .signup-card h1 {
      text-align: center;
      color: #66c0f4;
      margin-bottom: 22px;
      font-size: 28px;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid #4b6e87;
      background-color: #0f1c2d;
      color: #c6d4df;
      font-size: 14px;
      transition: 0.3s;
    }

    input::placeholder {
      color: #8fa7bf;
    }

    input:focus {
      border-color: #66c0f4;
      box-shadow: 0 0 0 2px rgba(102,192,244,0.2);
      outline: none;
    }

    .btn-signup {
      width: 100%;
      background: linear-gradient(90deg, #66c0f4, #4fa1d9);
      color: #0f1c2d;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      padding: 12px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }

    .btn-signup:hover {
      background: linear-gradient(90deg, #4fa1d9, #2a7fb8);
    }

    .error {
      color: #ff9a9a;
      font-size: 12px;
      margin-top: 4px;
    }

    .login-link {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
    }

    .login-link a {
      color: #66c0f4;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="signup-card">
  <h1>Steam</h1>

  <form onsubmit="return validateForm()">

    <div class="form-group">
      <input type="text" id="username" placeholder="Username">
      <div id="usernameErr" class="error"></div>
    </div>

    <div class="form-group">
      <input type="email" id="email" placeholder="Email address">
      <div id="emailErr" class="error"></div>
    </div>

    <div class="form-group">
      <input type="password" id="password" placeholder="Password">
      <div id="passwordErr" class="error"></div>
    </div>

    <button type="submit" class="btn-signup">Create Account</button>
  </form>

  <div class="login-link">
    Already have an account? <a href="#">Log in</a>
  </div>
</div>

<script>
  function validateForm() {
    let ok = true;

    usernameErr.innerHTML = "";
    emailErr.innerHTML = "";
    passwordErr.innerHTML = "";

    if (username.value.trim() === "") {
      usernameErr.innerHTML = "Username is required";
      ok = false;
    }

    if (email.value.trim() === "") {
      emailErr.innerHTML = "Email is required";
      ok = false;
    }

    if (password.value.trim() === "") {
      passwordErr.innerHTML = "Password is required";
      ok = false;
    }

    return ok;
  }
</script>

</body>
</html>
