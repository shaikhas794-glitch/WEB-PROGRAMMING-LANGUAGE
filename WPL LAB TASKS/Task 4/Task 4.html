<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            color: #1e293b;
            font-weight: 700;
        }

        form {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        input.form-control {
            border-radius: 8px;
            padding: 10px;
        }

        input.form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.25);
        }

        #submit {
            border-radius: 10px;
            font-weight: 600;
            padding: 12px;
            background: linear-gradient(90deg, #6366f1, #3b82f6);
            border: none;
            color: #fff;
        }

        table thead {
            background: #3b82f6;
            color: #fff;
        }

        table td, table th {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-4">Student Records</h1>

    <form id="studentForm" class="mb-3">

        <div class="mb-3">
            <label class="form-label">Roll No</label>
            <input type="text" id="roll" class="form-control" value="15938">
        </div>

        <div class="mb-3">
            <label class="form-label">Student Name</label>
            <input type="text" id="name" class="form-control" value="Abdul Samad">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="abdulsamad@email.com">
        </div>

        <div class="mb-3">
            <label class="form-label">Program</label>
            <input type="text" id="program" class="form-control" value="Computer Science">
        </div>

    </form>

    <button id="submit" class="btn w-100 mb-4" onclick="addStudent()">Add Record</button>

    <table class="table table-bordered bg-white shadow-sm">
        <thead>
            <tr>
                <th>#</th>
                <th>Roll No</th>
                <th>Name</th>
                <th>Email</th>
                <th>Program</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>
</div>

<script>
    let count = 0;

    function addStudent() {
        const roll = document.getElementById("roll").value.trim();
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const program = document.getElementById("program").value.trim();

        if (roll === "" || name === "" || email === "" || program === "") {
            alert("Please fill all fields");
            return;
        }

        count++;

        const table = document.getElementById("studentTable");
        const row = table.insertRow();

        row.insertCell(0).innerText = count;
        row.insertCell(1).innerText = roll;
        row.insertCell(2).innerText = name;
        row.insertCell(3).innerText = email;
        row.insertCell(4).innerText = program;

        document.getElementById("studentForm").reset();
    }
</script>

</body>
</html>
