<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Information</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body { background:#f5f7fa; }
        .message { padding:12px;border-radius:6px;text-align:center;margin-bottom:15px;font-weight:500 }
        .success { background:#d1e7dd;color:#0f5132 }
        .error { background:#f8d7da;color:#842029 }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">

            <h2 class="text-center mb-4">Student Information</h2>

            <div id="msg"></div>

            <form id="studentForm">
                <input type="hidden" id="index">

                <div class="mb-3">
                    <input type="text" id="name" class="form-control" placeholder="Student Name">
                </div>

                <div class="mb-3">
                    <input type="email" id="email" class="form-control" placeholder="Email Address">
                </div>

                <div class="mb-3">
                    <input type="text" id="course" class="form-control" placeholder="Course">
                </div>

                <button type="submit" class="btn btn-primary w-100">Save Student</button>
            </form>

        </div>
    </div>

    <table class="table table-hover table-bordered mt-4 bg-white shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th style="width:160px">Action</th>
            </tr>
        </thead>
        <tbody id="data"></tbody>
    </table>
</div>

<script>
$(function(){

    let students = JSON.parse(localStorage.getItem("students")) || [];

    function escapeHTML(text){
        return $("<div>").text(text).html();
    }

    function showMessage(text,type){
        $("#msg").html(`<div class="message ${type}">${text}</div>`);
        setTimeout(()=>$("#msg").html(""),2500);
    }

    function showData(){
        $("#data").empty();
        if(students.length === 0){
            $("#data").html("<tr><td colspan='4' class='text-center text-muted'>No records found</td></tr>");
            return;
        }
        $.each(students,function(i,s){
            $("#data").append(`
                <tr>
                    <td>${escapeHTML(s.name)}</td>
                    <td>${escapeHTML(s.email)}</td>
                    <td>${escapeHTML(s.course)}</td>
                    <td>
                        <button class="btn btn-warning btn-sm edit" data-id="${i}">Edit</button>
                        <button class="btn btn-danger btn-sm delete" data-id="${i}">Delete</button>
                    </td>
                </tr>
            `);
        });
    }

    function saveStorage(){
        localStorage.setItem("students",JSON.stringify(students));
    }

    $("#studentForm").on("submit",function(e){
        e.preventDefault();

        let name=$("#name").val().trim();
        let email=$("#email").val().trim();
        let course=$("#course").val().trim();
        let index=$("#index").val();

        if(!name||!email||!course){
            showMessage("All fields are required","error");
            return;
        }

        if(index===""){
            students.push({name,email,course});
            showMessage("Student added successfully","success");
        }else{
            students[index]={name,email,course};
            showMessage("Student updated successfully","success");
        }

        saveStorage();
        showData();
        this.reset();
        $("#index").val("");
    });

    $(document).on("click",".edit",function(){
        let i=$(this).data("id");
        $("#name").val(students[i].name);
        $("#email").val(students[i].email);
        $("#course").val(students[i].course);
        $("#index").val(i);
    });

    $(document).on("click",".delete",function(){
        let i=$(this).data("id");
        if(confirm("Delete this student?")){
            students.splice(i,1);
            saveStorage();
            showData();
            showMessage("Student deleted","success");
        }
    });

    showData();
});
</script>

</body>
</html>
